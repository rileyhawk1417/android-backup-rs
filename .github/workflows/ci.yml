name: CI

# The green gate from docs/plan/index.md rule 1: fmt, clippy, tests, on both
# target operating systems. Windows is in the matrix from the first commit on
# purpose — the backup utility must work without Android Studio on a machine
# that has never seen one, and a Windows-only failure found at release time is a
# rewrite, not a fix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # eframe/winit links against these on Linux, and the tray icon needs GTK 3
      # *headers* to build against (it reaches the indicator through libappindicator,
      # which is loaded at runtime and therefore needs no package here). Everything
      # else the crates need (rusqlite, sha2, reqwest with rustls) is vendored or
      # pure Rust.
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # The suites above run the application's logic without running the application.
  # That was not enough: the first 0.2.0 build passed every one of them and then
  # died behind a crash dialog on a real desktop, because the tray icon was built
  # on the window's thread, where gtk-rs refuses to work — and the window smoke
  # test, which recognised the crash dialog by its title, called it a pass. So one
  # job runs the built binary the way a user's desktop would, and checks the window
  # and the tray icon separately.
  smoke:
    name: smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Beyond the windowing libraries: a display for the window (Xvfb), a display
      # for `xdotool` to look at (it inspects the same one), a session bus for the
      # tray (dbus, for `dbus-run-session`) with a python that has Gio to answer on
      # it, and the appindicator library the icon is actually built on. That last
      # one is why this job exists: it is loaded with `dlopen` at runtime, so the
      # build succeeds without it and the tray cannot exist without it.
      - name: Linux GUI and tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libgl1-mesa-dev libgtk-3-dev \
            xvfb xdotool dbus python3-gi libayatana-appindicator3-1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the application
        run: cargo build -p android-backup-desktop

      - name: Smoke-test the window and the tray
        run: scripts/smoke-linux.sh target/debug/android-backup
