# Build and publish a release from a version tag.
#
#   git tag -a v0.1.0 -m v0.1.0 && git push origin v0.1.0
#
# The tag is the trigger, the version in Cargo.toml is the source of truth, and
# scripts/verify-tag.sh refuses to build anything if the two disagree. See
# docs/release.md for the whole procedure and for what each job does and does not
# prove.
#
# Formatting and lints are not repeated here: ci.yml already runs them on every
# push, including the tag, and a release should not be the first place a lint
# failure shows up.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: tag matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against Cargo.toml, Cargo.lock, CHANGELOG and the docs
        run: scripts/verify-tag.sh "$GITHUB_REF_NAME"

  linux:
    name: Linux artifacts
    needs: verify
    runs-on: ubuntu-latest
    # Deliberately an older distribution than the runner images: the glibc a
    # binary is linked against becomes its floor, and building on the newest
    # Ubuntu would quietly exclude LTS desktops. The floor this produces is
    # recorded in the artifact's .deps.txt.
    container:
      image: debian:12-slim
    steps:
      - name: Install the build and test toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config binutils git curl ca-certificates xz-utils \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev \
            libgl1-mesa-dri squashfs-tools desktop-file-utils \
            xvfb xdotool
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test
        run: cargo test --workspace --locked
      - name: Build the tarball
        run: scripts/package-linux.sh
      - name: Smoke-test the tarball's binary
        run: scripts/smoke-linux.sh dist/*/android-backup

      # The AppImage is best-effort. It wraps the same binary the tarball ships,
      # and whether it starts at all depends on the host (FUSE, AppImageLauncher),
      # so a failure here must not hold up the release — but an AppImage that
      # fails its own smoke test is deleted rather than published.
      - name: Build the AppImage
        id: appimage
        continue-on-error: true
        run: scripts/build-appimage.sh
      - name: Smoke-test the AppImage
        id: appimage_smoke
        if: steps.appimage.outcome == 'success'
        continue-on-error: true
        run: scripts/smoke-linux.sh dist/*.AppImage
      - name: Drop the AppImage if it did not pass
        if: steps.appimage_smoke.outcome != 'success'
        run: |
          echo "The AppImage did not build or did not pass its smoke test; publishing without it."
          rm -f dist/*.AppImage dist/*.AppImage.sha256

      - name: Record the runtime requirements
        run: cat dist/*.deps.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deps.txt
            dist/*.AppImage
            dist/*.AppImage.sha256

  windows:
    name: Windows artifact
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # The runner's rustup reads rust-toolchain.toml, so this is the same
      # toolchain a developer gets.
      - name: Show the toolchain
        run: rustup show
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p android-backup-desktop
      - name: Smoke-test the binary
        run: scripts/smoke-windows.ps1
      - name: Package the portable ZIP
        run: scripts/package-windows.ps1 -SkipSmoke
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.zip.sha256

  publish:
    name: publish the release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check every checksum before publishing it
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ./*.sha256
          ls -l
      - name: Compose the release notes from the changelog
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" dist > release-notes.md
      - name: Show the notes
        run: cat release-notes.md
      # A draft, not a published release: the notes and the checksums get one
      # human read before they are visible to the world. Publishing the draft is
      # one click, and the notes can be corrected there if they need it.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Android Backup Utility ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag \
            --draft \
            dist/*
