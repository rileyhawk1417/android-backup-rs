# Build and publish a release from a version tag.
#
#   git tag -a v0.1.0 -m v0.1.0 && git push origin v0.1.0
#
# The tag is the trigger, the version in Cargo.toml is the source of truth, and
# scripts/verify-tag.sh refuses to build anything if the two disagree. See
# docs/release.md for the whole procedure and for what each job does and does not
# prove.
#
# Formatting and lints are not repeated here: this workflow is the only one a
# tag triggers (ci.yml runs on branch pushes only), and the commits under a tag
# should have gone through it on main first — so a release is not the first
# place a lint failure shows up, and a tag on a commit that never passed ci.yml
# on main is a tag nobody should push.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: tag matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against Cargo.toml, Cargo.lock, CHANGELOG and the docs
        run: scripts/verify-tag.sh "$GITHUB_REF_NAME"

  linux:
    name: Linux artifacts
    needs: verify
    runs-on: ubuntu-latest
    # Deliberately an older distribution than the runner images: the glibc a
    # binary is linked against becomes its floor, and building on the newest
    # Ubuntu would quietly exclude LTS desktops. The floor this produces is
    # recorded in the artifact's .deps.txt.
    container:
      image: debian:12-slim
    steps:
      # Everything here is a *build* dependency, and nothing more. This workflow
      # does not smoke-test the artifacts: an artifact's host needs a display, a
      # session bus and OpenGL, and a debian-slim container offers none of them
      # — each release cycle that ran a smoke here proved it by failing on the
      # environment (a missing dbus-launch, an appindicator-less fallback)
      # rather than on the artifact. The window-plus-tray guarantee belongs to
      # ci.yml's smoke job, which runs on a full runner with Xvfb on every push,
      # and the release jobs' guarantee is the same suite ci.yml runs.
      - name: Install the build toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config binutils git curl ca-certificates xz-utils \
            libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev \
            squashfs-tools desktop-file-utils

      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test
        run: cargo test --workspace --locked
      - name: Build the tarball
        run: scripts/package-linux.sh

      # The AppImage is best-effort. It wraps the same binary the tarball ships,
      # and whether it mounts and starts depends on the host (FUSE,
      # AppImageLauncher), so a failure here must not hold up the release. Once
      # it builds, it is published, and its startup is one of the things a human
      # verifies on a real desktop once per release — a smoke needs a display,
      # and this container does not host one.
      - name: Build the AppImage
        id: appimage
        continue-on-error: true
        run: scripts/build-appimage.sh

      - name: Record the runtime requirements
        run: cat dist/*.deps.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deps.txt
            dist/*.AppImage
            dist/*.AppImage.sha256

  windows:
    name: Windows artifact
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      # The runner's rustup reads rust-toolchain.toml, so this is the same
      # toolchain a developer gets.
      - name: Show the toolchain
        run: rustup show
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p android-backup-desktop
      # The packaging call carries -SkipSmoke, and this is why: the artifact
      # checks cannot truthfully run in this environment — the runner's pwsh
      # closes the child's stdout pipe mid-answer (os error 232, so
      # $LASTEXITCODE never gets set and a check on it dies under StrictMode),
      # and the window has no OpenGL to open on (docs/troubleshooting.md §22).
      # The same checks run for a human via package-windows.ps1 without the
      # switch; CI's guarantee here is the test suite, plus ci.yml's smoke job,
      # which hosts the same sources' window on Xvfb.
      - name: Package the portable ZIP
        run: scripts/package-windows.ps1 -SkipSmoke
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.zip.sha256

  publish:
    name: publish the release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check every checksum before publishing it
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ./*.sha256
          ls -l
      - name: Compose the release notes from the changelog
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" dist > release-notes.md
      - name: Show the notes
        run: cat release-notes.md
      # A draft, not a published release: the notes and the checksums get one
      # human read before they are visible to the world. Publishing the draft is
      # one click, and the notes can be corrected there if they need it.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Android Backup Utility ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag \
            --draft \
            dist/*
