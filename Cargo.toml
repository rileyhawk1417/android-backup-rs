[workspace]
resolver = "2"
# Members are added back as their Wave lands:
#   crates/platform -> Wave 7,  crates/cli -> Wave 8
members = ["crates/core", "crates/desktop"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# 1.89 is notify-rust's floor; the desktop crate needs it for OS notifications
# (Wave 9). Nothing else in the workspace uses anything newer than 1.85.
rust-version = "1.89"

[workspace.dependencies]
core = { path = "crates/core", package = "android-backup-core" }
android-backup-core = { path = "crates/core" }
android-backup-platform = { path = "crates/platform" }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
quick-xml = "0.42"
dirs = "6"
fs4 = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.33"
rfd = "0.15"
# OS notifications (Wave 9, E09.4). `z` is the pure-Rust zbus backend on
# Linux — no libdbus headers to install, and Windows uses the WinRT toast API.
notify-rust = { version = "4", default-features = false, features = ["z"] }
# The system tray (Wave 9, E09.5). `gtk` is the Linux backend (StatusNotifierItem
# through libappindicator) and is inert on Windows, where the crate talks to the
# shell directly. `libxdo` is deliberately off: it is X11 input simulation, which
# a tray icon has no business doing.
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
tempfile = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = true
