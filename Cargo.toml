[workspace]
resolver = "2"
# Members are added back as their Wave lands:
#   crates/platform -> Wave 7,  crates/cli -> Wave 8
members = ["crates/core", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
core = { path = "crates/core", package = "android-backup-core" }
android-backup-core = { path = "crates/core" }
android-backup-platform = { path = "crates/platform" }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
quick-xml = "0.42"
dirs = "6"
sysinfo = "0.33"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.33"
rfd = "0.15"
tempfile = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
strip = true
