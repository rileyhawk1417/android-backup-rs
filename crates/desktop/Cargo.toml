[package]
name = "android-backup-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop UI for Android Backup Utility (egui/eframe)"

[lints]
workspace = true

[lib]
name = "android_backup_desktop"
path = "src/lib.rs"

[[bin]]
name = "android-backup"
path = "src/main.rs"

[dependencies]
android-backup-core.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
dirs.workspace = true
notify-rust.workspace = true
tray-icon.workspace = true

# Only to ask the dynamic loader whether the appindicator library exists, which the
# tray crate would otherwise find out by panicking (see `tray::indicator_library`).
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
# GTK is what a Linux tray icon is made of, and the tray has to initialise it itself:
# gtk-rs asserts "GTK has not been initialized" (a panic, not an error) if a menu is
# built before `gtk::init`, and `tray-icon` never calls it. Declared at the version
# `tray-icon`'s menu crate asks for, because gtk-rs's "is initialised" flag is
# thread- and crate-instance-local: two GTK versions in the graph would be two
# answers to the same question, and the tray thread would still panic.
gtk = "0.18"

[dev-dependencies]
tempfile.workspace = true
