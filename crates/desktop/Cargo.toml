[package]
name = "android-backup-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop UI for Android Backup Utility (egui/eframe)"

[lints]
workspace = true

[lib]
name = "android_backup_desktop"
path = "src/lib.rs"

[[bin]]
name = "android-backup"
path = "src/main.rs"

[dependencies]
android-backup-core.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
dirs.workspace = true
notify-rust.workspace = true
tray-icon.workspace = true

# Only to ask the dynamic loader whether the appindicator library exists, which the
# tray crate would otherwise find out by panicking (see `tray::indicator_library`).
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[dev-dependencies]
tempfile.workspace = true
